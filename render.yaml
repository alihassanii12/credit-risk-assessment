services:
  - type: web
    name: credit-risk-assessment
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    env: python
    region: oregon
    pythonVersion: "3.11.9"
